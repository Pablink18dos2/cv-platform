server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        # El MJPEG de /stream es una respuesta que no termina: sin esto nginx la acumula
        # en un buffer y el navegador no ve ningun fotograma.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # El dashboard es una SPA: cualquier ruta que no sea un fichero devuelve el index.
    location / {
        try_files $uri /index.html;
    }
}
