# nginx del Space (Hugging Face): corre como usuario normal (uid 1000), asi que el pid, los
# temporales y los logs van a /tmp y a stderr, no a /var. Escucha en 7860, el puerto del Space.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events {}

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 7860;
        root /app/web;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            # El MJPEG de /stream no termina: sin esto nginx lo acumularia en un buffer.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        # SPA: cualquier ruta que no sea un fichero devuelve el index.
        location / {
            try_files $uri /index.html;
        }
    }
}
