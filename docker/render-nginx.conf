# nginx de Render: corre como usuario normal (uid 1000), asi que el pid, los temporales y los
# logs van a /tmp y a stderr. start.sh sustituye __PORT__ por el $PORT que inyecta Render.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events {}

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen __PORT__;
        root /app/web;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            # El MJPEG de /stream no termina: sin esto nginx lo acumularia en un buffer.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        # Replay de la demo (deploy/demo/: clip.mp4 + timeline.json). nginx sirve Range (206) en
        # ficheros estaticos, que es lo que permite hacer scrub en el mp4. Sin fallback de SPA: si
        # el fichero no existe es un 404 de verdad, y el frontend entonces no muestra el replay.
        location /demo/ {
            alias /app/deploy/demo/;
            add_header Cache-Control "public, max-age=3600";
        }

        # SPA: cualquier ruta que no sea un fichero devuelve el index.
        location / {
            try_files $uri /index.html;
        }
    }
}
