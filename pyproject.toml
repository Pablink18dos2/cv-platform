[project]
name = "cv-platform"
version = "0.1.0"
description = "Plataforma local de vision por computador: connectors de video, modelos y analizadores por bloques"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
cvp = "cvp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/cvp"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "slow: carga un modelo real o decodifica video; segundos, no milisegundos",
    "network: sale a internet; fuera de la suite por defecto y de CI",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend/src", "tests"]
# Ruff formatea los bloques de codigo Python dentro de Markdown. En `_docs/` esos bloques
# son ilustrativos y estan recortados a proposito, asi que no deben romper CI.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
