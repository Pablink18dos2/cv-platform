[project]
name = "cv-platform"
version = "0.1.0"
description = "Plataforma local de vision por computador: connectors de video, modelos y analizadores por bloques"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # `cvp.api` es la API de lectura de #12: FastAPI genera el `openapi.yaml` que es el
    # contrato con el frontend y uvicorn la sirve. Son las unicas dependencias de la API
    # ademas de `cvp.storage`; `tests/unit/test_api_aislamiento.py` comprueba en un
    # subproceso que arrancarla no arrastra torch, cv2, ultralytics ni yt-dlp.
    "fastapi>=0.115",
    # `cvp.core` importa numpy directamente (el buffer de `Frame`), asi que se declara
    # aqui en vez de seguir entrando de forma transitiva por ultralytics: el core tiene
    # que poder instalarse sin el detector y seguir funcionando.
    "numpy>=2.1",
    # `cvp.sources` importa cv2 directamente para decodificar. Mismo criterio: entraba de
    # forma transitiva por ultralytics, pero un connector de video tiene que poder
    # instalarse sin el detector.
    "opencv-python>=4.10",
    # `cvp.pipeline.config` importa los dos directamente: Pydantic v2 valida el esquema
    # (ya decidido en `_docs/plan.md`) y PyYAML lee el fichero. `pyyaml` entraba de forma
    # transitiva por ultralytics; se declara por el mismo criterio que numpy, porque el
    # dia que ultralytics deje de traerlo la configuracion tiene que seguir cargando.
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # `cvp.storage` define el esquema con SQLModel, que es la decision de stack de
    # `_docs/plan.md`: una sola capa de modelos para SQLite en local y Postgres en Docker.
    # Arrastra SQLAlchemy, que es quien habla con las dos bases. Ni `cvp.core` ni
    # `cvp.pipeline.config` lo importan, y los dos tests de aislamiento lo comprueban.
    "sqlmodel>=0.0.22",
    "supervision>=0.25",
    "trackers>=0.1",
    "ultralytics>=8.3",
    "uvicorn>=0.30",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
cvp = "cvp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/cvp"]

# No hay CUDA en esta maquina y no la va a haber. En Linux el wheel por defecto de torch
# arrastra ~2,5 GB de CUDA que nunca se usarian, asi que fijamos el indice CPU: mismo
# resultado, imagen Docker mucho mas pequena y CI mas rapido.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    # El `TestClient` de FastAPI habla HTTP con httpx. Solo lo usan los tests de la API.
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
filterwarnings = [
    # Starlette >= 1.6 prefiere `httpx2` para su `TestClient` y avisa si encuentra `httpx`.
    # #12 autoriza `httpx`, que funciona; el aviso se silencia hasta que se decida el cambio.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "slow: carga un modelo real o decodifica video; segundos, no milisegundos",
    "network: sale a internet; fuera de la suite por defecto y de CI",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend/src", "tests"]
# Ruff formatea los bloques de codigo Python dentro de Markdown. En `_docs/` esos bloques
# son ilustrativos y estan recortados a proposito, asi que no deben romper CI.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
