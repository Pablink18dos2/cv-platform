# CD a Render (plan free). Ver "Deployment" en el README.
#
# Se dispara cuando CI termina bien en main, o a mano; `ref` permite desplegar un commit o tag
# anterior (rollback). Llama al deploy hook de Render con el SHA a desplegar y comprueba que la
# API responde.
#
# Necesita: secret RENDER_DEPLOY_HOOK (URL completa del deploy hook, con su `?key=`) y variable RENDER_URL
# (URL publica del servicio, sin barra final).

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag o rama a desplegar (vacio = la rama desde la que se lanza). Para rollback."
        type: string
        required: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_URL: ${{ vars.RENDER_URL }}
    steps:
      - name: Check configuration
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "::error::falta el secret RENDER_DEPLOY_HOOK"; exit 1; }
          test -n "$RENDER_URL" || { echo "::error::falta la variable RENDER_URL"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}

      - name: Trigger the Render deploy
        run: |
          # El hook de Render (su URL ya lleva `?key=`) acepta `&ref=<SHA completo>`; un tag o rama se resuelve antes.
          sha=$(git rev-parse HEAD)
          echo "Desplegando $sha"
          curl --fail --silent --show-error --output /dev/null "${RENDER_DEPLOY_HOOK}&ref=${sha}"

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 20 --retry-delay 15 --retry-all-errors \
            "${RENDER_URL}/api/v1/projects"
