# CI mínimo. Adapta los pasos a tu stack.
# Criterio 11 del proyecto final: 1 punto si ejecuta tests,
# 2 puntos si además despliega cuando los tests pasan.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Python + uv (por defecto) ---
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

