id: minimo
name: Fixture mínimo

source:
  type: youtube_live
  url: https://www.youtube.com/watch?v=EPKWu223XEg
  target_fps: 5
  reconnect: { backoff_s: [1, 2, 60, 30] }

detector:
  type: yolo
  classes: [car, truck]

tracker:
  type: bytetrack

analyzers:
  - type: traffic_flow
    lines:
      - { id: principal, p1: [0.06, 0.59], p2: [0.61, 0.56], positive_direction: norte }

sinks:
  - { type: sqlite }
