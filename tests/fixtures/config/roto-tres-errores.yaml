# Tres errores a proposito, uno por bloque, para comprobar que salen los tres de una
# sola pasada y ordenados por ruta de campo.
id: roto-tres-errores
name: Tres errores de una vez

source:
  type: youtube_live
  url: https://www.youtube.com/watch?v=EPKWu223XEg
  target_fps: -1.0

detector:
  type: yolo
  conf: 1.4
  classes: [car]

tracker:
  type: bytetrack

analyzers:
  - type: traffic_flow
    lines:
      - { id: principal, p1: [0.06, 0.59], p2: [0.61, 0.56], positive_direction: norte }
  # Sin `zones_file`, que si es obligatorio de verdad. La histeresis va a medias a
  # proposito: escribir solo uno de los dos umbrales es legal y deja el otro en su
  # valor por defecto, asi que aqui no anade un cuarto error.
  - type: parking_occupancy
    hysteresis: { to_occupied_s: 6 }

sinks:
  - { type: sqlite }
